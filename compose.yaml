services:
  pipeline:
    build: .

    # Reads the input files from ./data and writes the CSV files to ./data/output
    volumes:
      - ./data:/app/data

      # The DuckDB file stays in a Docker volume, not in the Windows folder:
      # DuckDB locks its file, and that can fail on a folder shared with Windows
      - duckdb:/app/db

    command: python -m src.pipeline --db-path /app/db/tech_news.duckdb

volumes:
  duckdb:
